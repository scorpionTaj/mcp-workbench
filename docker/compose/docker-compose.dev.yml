# Dev services only; run the app on the host with `bun run dev`.
# docker compose -f docker/compose/docker-compose.dev.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcpworkbench
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: mcpworkbench_dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpworkbench -d mcpworkbench_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_dev_data:
