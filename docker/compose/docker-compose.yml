# Production stack: Postgres (pgvector) + app. Redis is optional: `--profile cache`.
# Run from the repo root: docker compose --env-file .env -f docker/compose/docker-compose.yml up -d --build
# (or `bun run docker:prod`). `--env-file .env` matters: without it Compose looks for .env next to
# this file, so the `${VAR:?}` checks below would not see the repo-root .env.

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcpworkbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mcpworkbench}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpworkbench}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.2.1-bookworm
    restart: unless-stopped
    profiles: [cache]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Every variable in the repo-root .env reaches the app (email, rate limiting, scheduler,
    # provider fallback keys, ...). Entries under `environment:` override it.
    env_file:
      - path: ../../.env
        required: false
    environment:
      # Must point at the postgres service, not the localhost URL used for local dev.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mcpworkbench}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mcpworkbench}
      # Fail fast when the secrets are missing.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (openssl rand -base64 32)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public app URL}
      # Pinned to the image/volume layout so dev-only values in .env can't break the container.
      UPLOAD_DIR: /app/storage/uploads
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      REDIS_URL: ${REDIS_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
    volumes:
      - uploads:/app/storage/uploads
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  uploads:
