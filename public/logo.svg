<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>MCP Workbench</title>
  <defs>
    <linearGradient id="mcpw-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22B8FF"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="mcpw-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(18 12) rotate(50) scale(46)">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#mcpw-bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#mcpw-glow)"/>
  <!-- An "M" drawn as a connection through four nodes: the model linked to its context and tools. -->
  <path d="M17 45V21l15 15 15-15v24" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="17" cy="45" r="5" fill="#fff"/>
  <circle cx="47" cy="45" r="5" fill="#fff"/>
  <circle cx="17" cy="21" r="5" fill="#fff"/>
  <circle cx="47" cy="21" r="5" fill="#fff"/>
  <circle cx="32" cy="36" r="6.5" fill="#fff"/>
  <circle cx="32" cy="36" r="3" fill="#4F46E5"/>
</svg>
